<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f766e, #1e3a8a); padding: 16px;
    }
    .card {
      width: 100%; max-width: 380px; background: #fff; border-radius: 14px;
      padding: 28px 24px; box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }
    h1 { margin: 0 0 20px; font-size: 22px; text-align: center; color: #0f172a; }
    label { display: block; font-size: 14px; color: #334155; margin: 12px 0 6px; }
    input {
      width: 100%; padding: 11px 12px; font-size: 15px;
      border: 1px solid #cbd5e1; border-radius: 8px; outline: none;
    }
    input:focus { border-color: #0f766e; box-shadow: 0 0 0 3px rgba(15,118,110,.15); }
    button {
      width: 100%; margin-top: 20px; padding: 12px; font-size: 16px; font-weight: 600;
      color: #fff; background: #0f766e; border: 0; border-radius: 8px; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #msg { margin-top: 14px; font-size: 14px; text-align: center; min-height: 20px; }
    .ok { color: #15803d; } .err { color: #b91c1c; }
  </style>
</head>
<body>
  <form class="card" id="form">
    <h1>Đăng nhập</h1>

    <label for="name">Họ và tên</label>
    <input id="name" name="name" required placeholder="Nguyễn Văn A">

    <label for="email">Gmail</label>
    <input id="email" name="email" type="email" required placeholder="abc@gmail.com">

    <label for="phone">Số điện thoại</label>
    <input id="phone" name="phone" type="tel" required placeholder="0912345678" pattern="(0|\+84)[0-9]{9,10}">

    <button type="submit" id="btn">Gửi</button>
    <div id="msg"></div>
  </form>

  <script>
    const form = document.getElementById('form');
    const btn = document.getElementById('btn');
    const msg = document.getElementById('msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      msg.className = '';
      msg.textContent = 'Đang gửi...';

      const data = {
        name: form.name.value.trim(),
        email: form.email.value.trim(),
        phone: form.phone.value.trim()
      };

      try {
        const res = await fetch('/api/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const out = await res.json();
        if (!res.ok) throw new Error(out.error || 'Lỗi không xác định');
        msg.className = 'ok';
        msg.textContent = 'Gửi thành công!';
        form.reset();
      } catch (err) {
        msg.className = 'err';
        msg.textContent = 'Lỗi: ' + err.message;
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
