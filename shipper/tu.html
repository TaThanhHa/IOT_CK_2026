<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shipper - Mở tủ</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="shipper">
  <div class="card">

    <!-- Lượt giao: bấm ＋ mở từng tủ -->
    <div class="view" id="luotView">
      <h1 style="margin-bottom:4px">Giao cho <span id="khName"></span></h1>
      <p class="note" id="khPhone"></p>

      <div class="tiles" id="tiles"></div>
      <div class="bar"><span id="progress"></span><span id="trongLeft"></span></div>

      <p class="note" style="margin-top:14px">Bấm <b>＋</b> để mở 1 tủ trống. Bỏ hàng rồi <b>đẩy cửa lại</b>.<br>
        <span id="hetGio"></span></p>
      <button type="button" id="xongBtn">Giao đơn khác</button>
      <div class="msg" id="msg"></div>
    </div>

    <!-- Kết quả -->
    <div class="view hidden" id="doneView">
      <h1 id="doneTitle"></h1>
      <ul class="result" id="doneList"></ul>
      <button type="button" id="newBtn">Giao đơn mới</button>
    </div>
  </div>

  <script src="/common.js"></script>
  <script src="/theodoi.js"></script>
  <script>
    // Lượt giao: { phone, name, soNguoi, trong, maLuot, luot } — lưu localStorage để tải lại trang không mất
    // Node-RED giữ lượt theo SĐT khách + mã thiết bị máy này, tự kết thúc sau 10 phút không thao tác
    const KEY = 'giaoHang';
    const g = load(localStorage, KEY);
    if (!g) location.replace('sdt.html');

    const ship = (action, data) => post('/api/ship', Object.assign({ action, thietBi: thietBi() }, data));
    const save = () => keep(localStorage, KEY, g);
    let lech = 0;        // giờ máy chủ − giờ máy này
    let hetHan = null;   // lượt tự kết thúc lúc nào (giờ máy chủ)
    let xong = false;

    // ---------- Vẽ các ô tủ ----------
    // tt: cho_bung | mo | huy_cho | co_hang | tra_lai | khong_bung | loi
    const giay = (ms) => Math.max(0, Math.ceil(ms / 1000));
    function trangThai(t) {
      switch (t.tt) {
      case 'cho_bung':   return ['mo', '⏳', `Chờ cửa bung… ${giay(t.denKhi - Date.now() - lech)}s`];
      case 'mo':         return ['mo can-dong', '🔓', 'Bỏ hàng rồi đóng cửa'];
      case 'huy_cho':    return ['mo can-dong', '✕', 'Đóng cửa lại để huỷ'];
      case 'co_hang':    return ['dong', '✅', `Đã đóng · ${t.gam == null ? '?' : t.gam} g`];
      case 'tra_lai':    return ['tra_lai', '↩️', 'Trống, đã trả tủ'];
      case 'khong_bung': return ['loi', '⚠️', 'Cửa không mở được'];
      default:           return ['loi', '⚠️', 'Hết giờ, cửa chưa đóng'];
      }
    }
    const NUT_X = ['mo', 'co_hang', 'tra_lai', 'khong_bung'];

    function render() {
      const box = $('tiles');
      box.innerHTML = '';
      (g.luot || []).forEach((t) => {
        const [lop, icon, st] = trangThai(t);
        const el = document.createElement('div');
        el.className = 'tile ' + lop;
        el.innerHTML = `<b>${tenTu(t.id)}</b><span class="icon">${icon}</span><span class="st">${st}</span>`;
        if (NUT_X.includes(t.tt)) {
          const x = document.createElement('button');
          x.type = 'button';
          x.className = 'x';
          x.title = 'Không dùng tủ này';
          x.textContent = '✕';
          x.onclick = () => huyTu(x, t.id);
          el.appendChild(x);
        }
        if (t.tt === 'co_hang') {
          const b = document.createElement('button');
          b.type = 'button';
          b.textContent = 'Mở lại';
          b.onclick = () => openTu(b, t.id);
          el.appendChild(b);
        }
        box.appendChild(el);
      });

      const plus = document.createElement('button');
      plus.type = 'button';
      plus.className = 'plus';
      plus.disabled = g.trong === 0;
      plus.textContent = g.trong === 0 ? 'Hết tủ trống' : '＋';
      plus.onclick = () => openTu(plus);
      box.appendChild(plus);

      const giao = (g.luot || []).filter((t) => t.tt === 'co_hang').length;
      $('progress').textContent = (g.luot || []).length ? `Đã đóng ${giao} tủ có hàng` : 'Chưa mở tủ nào';
      $('trongLeft').textContent = g.trong ? `Còn ${g.trong} tủ trống` : '';
      const conLai = hetHan ? giay(hetHan - Date.now() - lech) : 0;
      $('hetGio').textContent = g.maLuot && conLai
        ? `Lượt tự kết thúc sau ${Math.floor(conLai / 60)}:${String(conLai % 60).padStart(2, '0')} nếu không thao tác` : '';
    }
    setInterval(() => { if (!xong) render(); }, 1000);   // đếm ngược

    // Báo khi 1 tủ vừa đổi trạng thái
    function baoDoi(cu, t) {
      const ten = tenTu(t.id);
      if (cu.tt === 'cho_bung' && t.tt === 'mo') return [`${ten} đã mở. Bỏ hàng rồi đóng cửa.`, 'ok'];
      if (t.tt === 'khong_bung') return [`${ten} không mở được. Bấm ✕ để bỏ, rồi bấm ＋ lấy tủ khác.`, 'err'];
      if (t.tt === 'co_hang' && cu.tt !== 'co_hang') return [`${ten} đã đóng — ${t.gam} g ✓`, 'ok'];
      if (t.tt === 'tra_lai' && cu.tt !== 'tra_lai') return [`${ten} đóng lại trống, đã trả tủ`, 'ok'];
      return null;
    }

    // Cập nhật từ Node-RED; trả true nếu lượt còn chạy (cần theo dõi tiếp)
    function capNhat(out) {
      const cu = {};
      (g.luot || []).forEach((t) => { cu[t.id] = t; });
      out.luot.forEach((t) => {
        const b = cu[t.id] && t.tt !== cu[t.id].tt ? baoDoi(cu[t.id], t) : null;
        if (b) show($('msg'), b[0], b[1]);
      });
      Object.keys(cu).forEach((id) => {
        if (cu[id].tt === 'huy_cho' && !out.luot.some((t) => t.id === id)) show($('msg'), `Đã huỷ ${tenTu(id)}`, 'ok');
      });
      g.maLuot = out.maLuot;
      g.luot = out.luot;
      g.trong = out.trong;
      hetHan = out.hetHan;
      lech = out.bayGio - Date.now();
      save();
      if (out.xong) { ketQua(null, 'Lượt giao đã tự kết thúc (10 phút không thao tác)'); return false; }
      render();
      return true;
    }

    const td = theoDoi(
      (biet) => ship('cho', { maLuot: g.maLuot, biet }),
      capNhat,
      (err) => {
        show($('msg'), err.message, 'err');
        if (/không hợp lệ|không còn/.test(err.message)) { td.dung(); boLuot(); }
      }
    );

    // ---------- ＋ / Mở lại / ✕ ----------
    function openTu(btn, id) {
      run(btn, $('msg'), id ? `Đang mở lại ${tenTu(id)}...` : 'Đang mở tủ...', async () => {
        const out = await ship('open', { phone: g.phone, maLuot: g.maLuot || undefined, tu: id });
        capNhat(out);
        show($('msg'), `Đã ra lệnh mở ${tenTu(out.moTu)}, chờ cửa bung...`, 'ok');
        td.batDau(out.ban);
      });
    }

    function huyTu(btn, id) {
      run(btn, $('msg'), `Đang huỷ ${tenTu(id)}...`, async () => {
        const out = await ship('huy', { maLuot: g.maLuot, tu: id });
        capNhat(out);
        const t = out.luot.find((x) => x.id === id);
        show($('msg'), t && t.tt === 'huy_cho' ? `Đóng cửa ${tenTu(id)} lại để huỷ` : `Đã bỏ ${tenTu(id)}`, 'ok');
        td.batDau(out.ban);
      });
    }

    // ---------- Kết thúc lượt ----------
    function boLuot() { keep(localStorage, KEY, null); setTimeout(() => location.replace('sdt.html'), 1500); }

    function ketQua(out, tieuDe) {
      xong = true;
      td.dung();
      keep(localStorage, KEY, null);
      document.querySelectorAll('.view').forEach((v) => v.classList.toggle('hidden', v.id !== 'doneView'));
      const coHang = out ? out.coHang : (g.luot || []).filter((t) => t.tt === 'co_hang').map((t) => ({ id: t.id, gam: t.gam }));
      $('doneTitle').textContent = tieuDe || (coHang.length ? 'Đã giao xong' : 'Không có kiện nào được gửi');
      const list = $('doneList');
      list.innerHTML = '';
      coHang.forEach((t) => {
        const li = document.createElement('li');
        li.textContent = `📦 ${tenTu(t.id)} — ${t.gam == null ? '?' : t.gam} g`;
        list.appendChild(li);
      });
      if (coHang.length) {
        const li = document.createElement('li');
        li.textContent = '✅ Khách đã thấy hàng khi mở web';
        list.appendChild(li);
      }
    }

    function giaoDonKhac(btn) {
      if (!g.maLuot) { keep(localStorage, KEY, null); location.replace('sdt.html'); return Promise.resolve(true); }
      let ok = false;
      return run(btn, $('msg'), 'Đang kiểm tra cửa tủ...', async () => {
        const out = await ship('xong', { maLuot: g.maLuot });
        ok = true;
        ketQua(out);
      }).then(() => ok);
    }
    $('xongBtn').addEventListener('click', () => giaoDonKhac($('xongBtn')));
    $('newBtn').addEventListener('click', () => location.replace('sdt.html'));

    // Nút quay lại của trình duyệt: hỏi trước khi rời lượt
    history.pushState({ giu: true }, '');
    window.addEventListener('popstate', async () => {
      if (xong) { location.replace('sdt.html'); return; }
      if (!confirm('Bạn đang trong lượt giao. Kết thúc lượt giao?')) { history.pushState({ giu: true }, ''); return; }
      if (!(await giaoDonKhac($('xongBtn')))) history.pushState({ giu: true }, '');   // còn tủ mở: ở lại
    });

    // ---------- Mở trang ----------
    if (g) {
      $('khName').textContent = g.name;
      $('khPhone').textContent = g.phone + (g.soNguoi > 1 ? ` · ${g.soNguoi} người dùng chung số` : '');
      render();
      if (!g.trong && !g.maLuot) show($('msg'), 'Hiện không còn tủ trống', 'err');
      if (g.maLuot) td.batDau({});   // tải lại trang / vào lại lượt: hỏi Node-RED ngay rồi theo dõi tiếp
    }
  </script>
</body>
</html>
