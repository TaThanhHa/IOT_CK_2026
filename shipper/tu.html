<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shipper - Mở tủ</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="shipper">
  <div class="card">
    <h1 style="margin-bottom:4px">Giao cho <span id="khName"></span></h1>
    <p class="note" id="khPhone"></p>

    <div class="tiles" id="tiles"></div>
    <div class="bar"><span id="progress"></span><span id="trongLeft"></span></div>

    <p class="note" style="margin-top:14px">Bấm <b>＋</b> để mở 1 tủ trống. Bỏ hàng rồi <b>đẩy cửa lại</b> là xong, không cần xác nhận.</p>
    <button type="button" id="xongBtn">Xong, giao đơn khác</button>
    <div class="msg" id="msg"></div>
  </div>

  <script src="/common.js"></script>
  <script src="/theodoi.js"></script>
  <script>
    // Lượt giao: { phone, name, soNguoi, trong, maLuot, luot } — lưu localStorage để tải lại trang không mất
    const KEY = 'giaoHang';
    const g = load(localStorage, KEY);
    if (!g) location.replace('sdt.html');

    const ship = (action, data) => post('/api/ship', Object.assign({ action }, data));
    const save = () => keep(localStorage, KEY, g);
    let lech = 0;   // giờ máy chủ − giờ máy này (để tính hạn Mở lại)

    // ---------- Vẽ các ô tủ ----------
    // tt: mo | co_hang | tra_lai | loi
    const LOP = { mo: 'mo can-dong', co_hang: 'dong', tra_lai: 'tra_lai', loi: 'loi' };
    function trangThai(t) {
      if (t.tt === 'mo') return ['🔓', t.cua === 'mo' ? 'Bỏ hàng rồi đóng cửa' : 'Đã mở khoá'];
      if (t.tt === 'co_hang') return ['✅', `Đã giao · ${t.gam == null ? '?' : t.gam} g`];
      if (t.tt === 'tra_lai') return ['↩️', 'Trống, đã trả tủ'];
      return ['⚠️', 'Hết giờ, cửa chưa đóng'];
    }

    function render() {
      const box = $('tiles');
      box.innerHTML = '';
      (g.luot || []).forEach((t) => {
        const [icon, st] = trangThai(t);
        const el = document.createElement('div');
        el.className = 'tile ' + LOP[t.tt];
        el.innerHTML = `<b>${tenTu(t.id)}</b><span class="icon">${icon}</span><span class="st">${st}</span>`;
        if (t.tt === 'co_hang' && Date.now() + lech < t.moLaiDen) {
          const b = document.createElement('button');
          b.type = 'button';
          b.textContent = 'Mở lại';
          b.onclick = () => openTu(b, t.id);
          el.appendChild(b);
        }
        box.appendChild(el);
      });

      const plus = document.createElement('button');
      plus.type = 'button';
      plus.className = 'plus';
      plus.disabled = g.trong === 0;
      plus.textContent = g.trong === 0 ? 'Hết tủ trống' : '＋';
      plus.onclick = () => openTu(plus);
      box.appendChild(plus);

      const giao = (g.luot || []).filter((t) => t.tt === 'co_hang').length;
      $('progress').textContent = (g.luot || []).length ? `Đã giao ${giao} tủ` : 'Chưa mở tủ nào';
      $('trongLeft').textContent = g.trong ? `Còn ${g.trong} tủ trống` : '';
    }
    setInterval(render, 5000);   // ẩn nút Mở lại khi hết hạn

    // Cập nhật từ Node-RED; trả true nếu còn tủ đang mở (cần theo dõi tiếp)
    function capNhat(out) {
      const cu = {};
      (g.luot || []).forEach((t) => { cu[t.id] = t; });
      out.luot.forEach((t) => {
        if (!cu[t.id] || cu[t.id].tt !== 'mo' || t.tt === 'mo') return;
        if (t.tt === 'co_hang') show($('msg'), `${tenTu(t.id)} đã đóng — đã giao ${t.gam} g ✓`, 'ok');
        else if (t.tt === 'tra_lai') show($('msg'), `${tenTu(t.id)} đóng lại trống, đã trả tủ`, 'ok');
        else show($('msg'), `${tenTu(t.id)} hết giờ mà cửa chưa đóng. Hãy đóng cửa lại.`, 'err');
      });
      out.luot.forEach((t) => { cu[t.id] = t; });   // ô đã trả tủ giữ nguyên trên màn hình
      g.luot = Object.keys(cu).sort().map((id) => cu[id]);
      if (out.trong != null) g.trong = out.trong;
      if (out.bayGio) lech = out.bayGio - Date.now();
      save();
      render();
      return g.luot.some((t) => t.tt === 'mo');
    }

    const td = theoDoi(
      (biet) => ship('cho', { maLuot: g.maLuot, biet }),
      capNhat,
      (err) => show($('msg'), err.message, 'err')
    );

    // ---------- ＋ hoặc Mở lại ----------
    function openTu(btn, id) {
      run(btn, $('msg'), id ? `Đang mở lại ${tenTu(id)}...` : 'Đang mở tủ...', async () => {
        const out = await ship('open', { phone: g.phone, maLuot: g.maLuot || undefined, tu: id });
        g.maLuot = out.maLuot;
        capNhat(out);
        show($('msg'), `Đã mở ${tenTu(out.moTu)}. Bỏ hàng rồi đẩy cửa lại.`, 'ok');
        td.batDau(out.ban);
      });
    }

    $('xongBtn').addEventListener('click', () => {
      if ((g.luot || []).some((t) => t.tt === 'mo')
        && !confirm('Còn tủ đang mở. Tủ sẽ tự chốt khi cửa được đóng. Vẫn kết thúc?')) return;
      td.dung();
      keep(localStorage, KEY, null);
      location.replace('sdt.html');
    });

    // ---------- Mở trang ----------
    if (g) {
      $('khName').textContent = g.name;
      $('khPhone').textContent = g.phone + (g.soNguoi > 1 ? ` · ${g.soNguoi} người dùng chung số` : '');
      render();
      if (!g.trong && !g.maLuot) show($('msg'), 'Hiện không còn tủ trống', 'err');

      // Tải lại trang giữa chừng: hỏi Node-RED ngay để vẽ đúng trạng thái
      if (g.maLuot) {
        const biet = {};
        (g.luot || []).forEach((t) => { biet[t.id] = -1; });
        ship('cho', { maLuot: g.maLuot, biet }).then((out) => {
          if (capNhat(out)) td.batDau(out.ban);
        }).catch((err) => show($('msg'), err.message, 'err'));
      }
    }
  </script>
</body>
</html>
